name: ULTRON MOBILE build

on:
  push:
    paths:
      - "ultron-mobile/**"
      - ".github/workflows/ultron-mobile.yml"
  pull_request:
    paths:
      - "ultron-mobile/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultron-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-mobile-debug-apk
          path: ultron-mobile/app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-mobile-reports
          path: |
            ultron-mobile/app/build/reports/
            ultron-mobile/app/build/test-results/
