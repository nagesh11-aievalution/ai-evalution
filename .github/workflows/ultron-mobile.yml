name: ULTRON MOBILE build

on:
  push:
    paths:
      - "ultron-mobile/**"
      - ".github/workflows/ultron-mobile.yml"
  pull_request:
    paths:
      - "ultron-mobile/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultron-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-mobile-debug-apk
          path: ultron-mobile/app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-mobile-reports
          path: |
            ultron-mobile/app/build/reports/
            ultron-mobile/app/build/test-results/

  device-test:
    # Runs the app on a real Android emulator: instrumented UI tests + a screenshot.
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ultron-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests + screenshot on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          working-directory: ultron-mobile
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            ./gradlew --no-daemon installDebug
            adb shell am start -W -n com.ultron.mobile/.MainActivity
            sleep 6
            adb exec-out screencap -p > screenshot-home.png
            adb shell pm grant com.ultron.mobile android.permission.RECORD_AUDIO
            adb shell am force-stop com.ultron.mobile
            adb shell am start -W -n com.ultron.mobile/.MainActivity
            sleep 6
            adb exec-out screencap -p > screenshot-mic-allowed.png

      - name: Upload screenshots and device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-mobile-device-test
          path: |
            ultron-mobile/screenshot-*.png
            ultron-mobile/app/build/reports/androidTests/
            ultron-mobile/app/build/outputs/androidTest-results/
