<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#07060a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ultron</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="brand-name">ULTRON</span>
        <span class="mode" id="modeBadge">offline</span>
      </div>
      <div class="top-actions">
        <span class="laptop-dot" id="laptopDot" title="Laptop link"></span>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <section class="core" id="core">
      <button class="orb" id="orb" data-state="idle" aria-label="Tap to talk">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="eye"></span>
      </button>
      <div class="status" id="status">Tap the core to talk</div>
    </section>

    <main class="log" id="log" aria-live="polite"></main>

    <form class="composer" id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Command Ultron…" enterkeyhint="send" />
      <button type="button" class="icon-btn mic" id="micBtn" aria-label="Voice">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="icon-btn send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l16-8-6 16-2-7-8-1z"/></svg>
      </button>
    </form>
  </div>

  <dialog id="settings">
    <form method="dialog" class="sheet">
      <h2>Settings</h2>

      <fieldset>
        <legend>Brain</legend>
        <label>Mode
          <select id="setBrain">
            <option value="claude">Claude (full AI)</option>
            <option value="laptop">Laptop Ultron (forward everything)</option>
            <option value="offline">Offline commands only</option>
          </select>
        </label>
        <label>Claude API key
          <input id="setKey" type="password" placeholder="sk-ant-…" autocomplete="off" />
        </label>
        <p class="hint">Stored only on this phone. The app sends it straight to Anthropic, never anywhere else.</p>
        <label>Model
          <input id="setModel" type="text" />
        </label>
        <label>Speed / depth
          <select id="setEffort">
            <option value="low">Fast (low effort)</option>
            <option value="medium">Balanced</option>
            <option value="high">Deep (high effort)</option>
          </select>
        </label>
        <label>Your name
          <input id="setName" type="text" placeholder="What should Ultron call you?" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Voice</legend>
        <label class="row"><input id="setSpeak" type="checkbox" /> Speak replies</label>
        <label class="row"><input id="setHands" type="checkbox" /> Hands-free (listen again after each reply)</label>
        <label>Voice
          <select id="setVoice"></select>
        </label>
        <label>Language
          <input id="setLang" type="text" placeholder="en-IN" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Laptop link</legend>
        <label>Laptop Ultron URL
          <input id="setLaptopUrl" type="url" placeholder="https://my-laptop.tailnet.ts.net:8765" />
        </label>
        <label>Shared token
          <input id="setLaptopToken" type="password" placeholder="same as ULTRON_TOKEN on the laptop" autocomplete="off" />
        </label>
        <button type="button" class="btn ghost" id="testLaptop">Test connection</button>
        <p class="hint" id="laptopResult"></p>
      </fieldset>

      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="clearChat">Clear memory &amp; chat</button>
        <button value="save" class="btn" id="saveSettings">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
